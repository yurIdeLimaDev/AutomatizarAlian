name: Web - parity and browsers
on:
  push:
    branches: [main]
    paths: ['web/**', 'pp/files/**/*.py', 'pp/tabelas teste/**', 'pp/exemplo 2/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'pp/files/**/*.py', 'pp/tabelas teste/**', 'pp/exemplo 2/**', '.github/workflows/web.yml']
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/tests/requirements.txt
      - run: npm ci
      - run: pip install -r tests/requirements.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run test:e2e -- --project=chromium --project=firefox --project=webkit
      - name: Verify repeated WebKit startup, cancellation and downloads
        run: npm run test:e2e -- --project=webkit --repeat-each=3
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            web/test-results/smoke-*/
            web/test-results/interaction-*/
          retention-days: 3
